<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Risk Reveal デザイン案 10 種 — Retro JRPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap"
    />
    <style>
      /* ──────────────────────────────────────────────────────────
         Design tokens (frontend.instructions.md / retro JRPG theme)
         ────────────────────────────────────────────────────────── */
      :root {
        --shadow-ink: #05060f;
        --midnight: #0a0e27;
        --deep-purple: #1a0b2e;
        --neon-magenta: #ff2e88;
        --neon-cyan: #00f0ff;
        --crt-amber: #ffb000;
        --gb-green: #9bbc0f;
        --phosphor: #e8f4ff;

        --font-pixel: 'Press Start 2P', monospace;
        --font-pixel-jp: 'DotGothic16', monospace;
        --font-terminal: 'VT323', monospace;
        --font-mono: 'IBM Plex Mono', monospace;

        /* the secret-scanning entry accent */
        --accent: #ff2e88;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        color: var(--phosphor);
        font-family: var(--font-pixel-jp);
        background: radial-gradient(circle at 50% 0%, var(--deep-purple) 0%, var(--midnight) 45%, var(--shadow-ink) 100%);
        background-attachment: fixed;
        padding: 2.5rem clamp(1rem, 3vw, 2.5rem) 5rem;
      }

      /* Faint CRT scanlines overlay */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.12) 3px,
          rgba(0, 0, 0, 0.12) 4px
        );
        opacity: 0.5;
      }

      .page-head { max-width: 1500px; margin: 0 auto 2rem; }
      .page-head h1 {
        font-family: var(--font-pixel);
        font-size: clamp(0.85rem, 2.2vw, 1.3rem);
        line-height: 1.6;
        color: var(--neon-cyan);
        text-shadow: 0 0 8px var(--neon-cyan), 0 0 24px rgba(0, 240, 255, 0.4);
        margin: 0 0 1rem;
      }
      .page-head p { font-size: 1rem; line-height: 1.7; max-width: 78ch; opacity: 0.85; margin: 0.4rem 0; }
      .page-head .legend { margin-top: 0.9rem; font-family: var(--font-terminal); font-size: 1.3rem; color: var(--crt-amber); }

      .controls { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-top: 1.1rem; }
      .ctl {
        font-family: var(--font-terminal);
        font-size: 1.15rem;
        letter-spacing: 0.06em;
        color: var(--neon-cyan);
        background: rgba(0, 240, 255, 0.06);
        border: 2px solid rgba(0, 240, 255, 0.5);
        padding: 0.25rem 0.9rem;
        cursor: pointer;
        border-radius: 0;
      }
      .ctl:hover { background: rgba(0, 240, 255, 0.16); box-shadow: 0 0 8px var(--neon-cyan), 0 0 24px rgba(0, 240, 255, 0.35); }
      .ctl.on { background: var(--neon-cyan); color: var(--shadow-ink); box-shadow: 0 0 8px var(--neon-cyan), 0 0 24px rgba(0, 240, 255, 0.45); }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 2.5rem 2rem;
        max-width: 1500px;
        margin: 0 auto;
        align-items: start;
      }
      @media (max-width: 1080px) { .gallery { grid-template-columns: minmax(0, 1fr); } }

      .proto { display: flex; flex-direction: column; min-width: 0; }
      .proto.wide { grid-column: 1 / -1; }
      @media (max-width: 1080px) { .proto.wide { grid-column: auto; } }

      .proto-label {
        font-family: var(--font-pixel);
        font-size: 0.6rem;
        line-height: 1.5;
        color: var(--neon-magenta);
        text-shadow: 0 0 6px rgba(255, 46, 136, 0.5);
        margin-bottom: 0.35rem;
      }
      .proto-desc { font-size: 0.85rem; line-height: 1.55; opacity: 0.72; margin-bottom: 0.8rem; min-height: 2.6em; }

      /* ── True-to-life slide frame ──────────────────────────────
         Measured on the live site (present mode):
           content column 1152px · base font 24px · usable height ~880px
         The frame is authored at 768x587 logical px with a 16px root,
         which is exactly 1152x880 / 1.5 — so every relative type size
         here matches the real slide 1:1. It is then scaled to fit
         whatever column width the gallery gives it.
         ────────────────────────────────────────────────────────── */
      .slide-stage {
        position: relative;
        width: 100%;
        overflow: hidden;
        border: 2px solid rgba(0, 240, 255, 0.28);
        background: rgba(5, 6, 15, 0.6);
        box-shadow: 4px 4px 0 var(--shadow-ink), 0 0 14px rgba(0, 240, 255, 0.12);
      }
      .slide-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 768px;
        height: 587px;
        transform-origin: top left;
        padding: 1.15rem 1.4rem 1.3rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      /* red hairline appears when the design would overflow a real slide */
      .slide-stage.overflowing { border-color: var(--neon-magenta); }
      .slide-stage.overflowing::after {
        content: 'OVERFLOWS';
        position: absolute;
        right: 0; bottom: 0;
        font-family: var(--font-pixel);
        font-size: 0.5rem;
        letter-spacing: 0.1em;
        color: var(--shadow-ink);
        background: var(--neon-magenta);
        padding: 4px 7px;
      }
      .slide-h2 {
        font-family: var(--font-pixel-jp);
        font-size: 1.6rem;
        line-height: 1.25;
        color: var(--phosphor);
        margin: 0 0 0.55rem;
        border-left: 5px solid var(--accent);
        padding-left: 0.6rem;
        text-shadow: 0 0 10px rgba(255, 46, 136, 0.35);
      }
      .risk-intro { font-size: 0.82rem; line-height: 1.55; opacity: 0.8; margin: 0 0 0.8rem; }
      .risk-intro b { color: var(--crt-amber); }
      .risk-foot {
        margin-top: auto;
        padding-top: 0.7rem;
        font-size: 0.78rem;
        line-height: 1.5;
        color: rgba(232, 244, 255, 0.75);
        border-top: 1px dashed rgba(0, 240, 255, 0.25);
      }
      .risk-foot b { color: var(--crt-amber); }

      .risk-widget { min-width: 0; }

      /* ══════════════════════════════════════════════════════════
         SHARED ACCORDION SKELETON (V1 V2 V3 V4 V6 V9)
         ══════════════════════════════════════════════════════════ */
      .risk-list { display: flex; flex-direction: column; gap: 0.28rem; }
      .risk-item { min-width: 0; }
      .risk-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font: inherit;
        font-size: 0.95rem;
        text-align: left;
        color: var(--phosphor);
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0.34rem 0.5rem;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .risk-num {
        font-family: var(--font-terminal);
        font-size: 1.1rem;
        line-height: 1;
        color: var(--neon-cyan);
        flex: none;
        min-width: 1.6em;
      }
      .risk-icon { flex: none; font-size: 1rem; line-height: 1; }
      .risk-label { flex: 1 1 auto; min-width: 0; }
      .risk-toggle {
        flex: none;
        font-family: var(--font-terminal);
        font-size: 1.2rem;
        line-height: 1;
        color: var(--crt-amber);
        transition: transform 0.2s ease, color 0.15s ease;
      }
      .risk-item.open .risk-toggle { color: var(--neon-magenta); transform: rotate(45deg); }
      .risk-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s ease; }
      .risk-item.open .risk-body { grid-template-rows: 1fr; }
      .risk-body-inner { overflow: hidden; min-height: 0; }
      .risk-why {
        font-size: 0.88rem;
        line-height: 1.6;
        color: rgba(232, 244, 255, 0.88);
        margin: 0;
        padding: 0.45rem 0.6rem 0.65rem 2.7rem;
      }
      .risk-why b { color: var(--crt-amber); }

      /* ── V1 — Codex Rows (anchor) ── */
      .v1 .risk-list { gap: 0; }
      .v1 .risk-item { border-bottom: 1px dashed rgba(0, 240, 255, 0.2); }
      .v1 .risk-item:first-child { border-top: 1px dashed rgba(0, 240, 255, 0.2); }
      .v1 .risk-btn { border-left: 3px solid transparent; padding-left: 0.7rem; }
      .v1 .risk-btn:hover { background: rgba(0, 240, 255, 0.07); }
      .v1 .risk-item.open .risk-btn { border-left-color: var(--neon-magenta); background: rgba(255, 46, 136, 0.1); color: #fff; }
      .v1 .risk-item.open .risk-num { color: var(--neon-magenta); }
      .v1 .risk-toggle::before { content: '[+]'; }
      .v1 .risk-item.open .risk-toggle { transform: none; }
      .v1 .risk-item.open .risk-toggle::before { content: '[-]'; }
      .v1 .risk-why { border-left: 3px solid rgba(255, 46, 136, 0.4); margin-left: 0.7rem; padding-left: 2rem; }

      /* ── V2 — Window Frame (anchor) ── */
      .v2 .risk-list { gap: 0.2rem; }
      .v2 .risk-item { border: 1px dashed rgba(0, 240, 255, 0.3); background: rgba(10, 14, 39, 0.55); position: relative; }
      .v2 .risk-item.open { border: 2px solid var(--neon-magenta); box-shadow: 0 0 8px var(--neon-magenta), 0 0 24px rgba(255, 46, 136, 0.3); background: rgba(255, 46, 136, 0.08); }
      .v2 .risk-item.open::before,
      .v2 .risk-item.open::after {
        content: '';
        position: absolute;
        width: 9px; height: 9px;
        border: 2px solid var(--crt-amber);
      }
      .v2 .risk-item.open::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
      .v2 .risk-item.open::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
      .v2 .risk-btn:hover { background: rgba(0, 240, 255, 0.08); }
      .v2 .risk-btn { padding: 0.28rem 0.5rem; }
      .v2 .risk-item.open .risk-num { color: var(--crt-amber); }
      .v2 .risk-toggle::before { content: '+'; }
      .v2 .risk-item.open .risk-toggle::before { content: '+'; }
      .v2 .risk-why { padding-top: 0; border-top: 1px dashed rgba(255, 46, 136, 0.35); padding-top: 0.5rem; margin: 0 0.6rem; }

      /* ── V3 — Threat Terminal (re-frame) ── */
      .v3 { font-family: var(--font-mono); }
      .v3 .risk-widget-inner { border: 2px solid rgba(155, 188, 15, 0.5); background: rgba(5, 6, 15, 0.8); padding: 0.5rem 0.6rem; }
      .v3 .risk-list { gap: 0; }
      .v3 .risk-btn { font-family: var(--font-mono); font-size: 0.78rem; padding: 0.2rem 0.3rem; color: var(--gb-green); gap: 0.4rem; }
      .v3 .risk-btn:hover { background: rgba(155, 188, 15, 0.12); }
      .v3 .risk-num { font-family: var(--font-mono); font-size: 0.78rem; color: rgba(155, 188, 15, 0.6); min-width: auto; }
      .v3 .risk-num::before { content: '$ '; }
      .v3 .risk-icon { display: none; }
      .v3 .risk-toggle { font-family: var(--font-mono); font-size: 0.72rem; color: rgba(155, 188, 15, 0.55); transform: none !important; }
      .v3 .risk-toggle::before { content: '--explain'; }
      .v3 .risk-item.open .risk-btn { color: var(--crt-amber); text-shadow: 0 0 8px rgba(255, 176, 0, 0.5); }
      .v3 .risk-item.open .risk-toggle { color: var(--crt-amber); }
      .v3 .risk-why {
        font-family: var(--font-mono);
        font-size: 0.74rem;
        line-height: 1.65;
        color: rgba(155, 188, 15, 0.95);
        padding: 0.35rem 0.3rem 0.6rem 1.1rem;
        border-left: 2px solid rgba(155, 188, 15, 0.4);
        margin-left: 0.3rem;
      }
      .v3 .risk-item.open .risk-why::after {
        content: '▊';
        margin-left: 0.2em;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* ── V4 — Bestiary (re-frame) ── */
      .v4 .risk-list { gap: 0.22rem; }
      .v4 .risk-item { background: rgba(10, 14, 39, 0.5); border-left: 3px solid rgba(255, 46, 136, 0.35); }
      .v4 .risk-btn { padding: 0.3rem 0.5rem; }
      .v4 .risk-btn:hover { background: rgba(255, 46, 136, 0.1); }
      .v4 .risk-item.open { border-left-color: var(--neon-magenta); background: rgba(255, 46, 136, 0.1); }
      .v4 .risk-gauge {
        flex: none;
        display: inline-flex;
        gap: 2px;
        margin-left: auto;
        padding-right: 0.4rem;
      }
      .v4 .risk-gauge i,
      .vx .risk-gauge i { width: 7px; height: 12px; background: rgba(232, 244, 255, 0.14); display: block; }
      .v4 .risk-gauge i.on,
      .vx .risk-gauge i.on { background: var(--neon-magenta); box-shadow: 0 0 6px var(--neon-magenta); }
      .v4 .risk-label { flex: 0 1 auto; }
      .v4 .risk-toggle::before { content: '▸'; }
      .v4 .risk-item.open .risk-toggle { transform: rotate(90deg); }
      .v4 .risk-why { padding-left: 2.9rem; }
      .risk-gauge { display: none; }
      .v4 .risk-gauge { display: inline-flex; }

      /* ══════════════════════════════════════════════════════════
         VX — FINAL MIX : V2 window frame
                        + V4 danger gauge
                        + V3 blinking cursor
                        + V6 CLASSIFIED stamp
         ══════════════════════════════════════════════════════════ */
      .vx .risk-gauge {
        display: inline-flex;
        gap: 2px;
        flex: none;
        margin-left: auto;
        padding-right: 0.55rem;
      }
      .vx .risk-label { flex: 0 1 auto; }
      .vx .risk-toggle { font-size: 1.45rem; }
      .vx .risk-list { gap: 0.14rem; }
      .vx .risk-btn { padding: 0.24rem 0.5rem; }
      .vx .risk-why { position: relative; padding-bottom: 1.3rem; }
      .vx .risk-item.open .risk-why::after {
        content: '▊';
        margin-left: 0.15em;
        color: var(--crt-amber);
        animation: blink 1s steps(1) infinite;
      }
      .vx .risk-item.open .risk-why::before {
        content: 'CLASSIFIED';
        position: absolute;
        right: 0.3rem;
        bottom: 0.2rem;
        font-family: var(--font-pixel);
        font-size: 0.44rem;
        letter-spacing: 0.12em;
        color: var(--neon-magenta);
        border: 2px solid var(--neon-magenta);
        padding: 3px 5px;
        transform: rotate(-8deg);
        opacity: 0.55;
      }

      /* ── V6 — Case File (re-frame) ── */
      .v6 .risk-list { gap: 0.26rem; }
      .v6 .risk-item {
        background: rgba(255, 176, 0, 0.05);
        border: 1px dashed rgba(255, 176, 0, 0.4);
        border-left: 4px solid rgba(255, 176, 0, 0.55);
      }
      .v6 .risk-btn { padding: 0.3rem 0.55rem; }
      .v6 .risk-btn:hover { background: rgba(255, 176, 0, 0.1); }
      .v6 .risk-num { color: var(--crt-amber); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; }
      .v6 .risk-num::before { content: 'CASE-'; opacity: 0.6; }
      .v6 .risk-item.open { border-color: var(--crt-amber); border-left-color: var(--crt-amber); background: rgba(255, 176, 0, 0.1); box-shadow: 0 0 8px rgba(255, 176, 0, 0.4); }
      .v6 .risk-toggle::before { content: '+'; }
      .v6 .risk-why {
        padding-left: 1rem;
        margin: 0 0.55rem;
        border-top: 1px dashed rgba(255, 176, 0, 0.4);
        padding-top: 0.5rem;
        position: relative;
      }
      .v6 .risk-item.open .risk-why::before {
        content: 'CLASSIFIED';
        position: absolute;
        right: 0.2rem;
        bottom: 0.3rem;
        font-family: var(--font-pixel);
        font-size: 0.42rem;
        letter-spacing: 0.12em;
        color: var(--neon-magenta);
        border: 2px solid var(--neon-magenta);
        padding: 3px 5px;
        transform: rotate(-8deg);
        opacity: 0.55;
      }

      /* ── V9 — Alarm Console (wildcard) ── */
      .v9 .risk-widget-inner {
        border: 2px solid rgba(255, 46, 136, 0.45);
        background: repeating-linear-gradient(135deg, rgba(255, 46, 136, 0.05) 0 8px, rgba(5, 6, 15, 0.4) 8px 16px);
        padding: 0.5rem;
      }
      .v9 .risk-list { gap: 0.18rem; }
      .v9 .risk-item { background: rgba(5, 6, 15, 0.75); border: 1px solid rgba(255, 46, 136, 0.25); }
      .v9 .risk-btn { padding: 0.26rem 0.45rem; gap: 0.5rem; }
      .v9 .risk-lamp {
        flex: none;
        width: 11px; height: 11px;
        border: 1px solid rgba(255, 46, 136, 0.7);
        background: rgba(255, 46, 136, 0.18);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .risk-lamp { display: none; }
      .v9 .risk-lamp { display: block; }
      @keyframes pulse { 50% { background: rgba(255, 46, 136, 0.65); box-shadow: 0 0 8px var(--neon-magenta); } }
      .v9 .risk-item.open .risk-lamp { animation: none; background: var(--gb-green); border-color: var(--gb-green); box-shadow: 0 0 8px var(--gb-green), 0 0 24px rgba(155, 188, 15, 0.4); }
      .v9 .risk-num { font-family: var(--font-mono); font-size: 0.68rem; color: rgba(255, 46, 136, 0.7); }
      .v9 .risk-btn:hover { background: rgba(255, 46, 136, 0.12); }
      .v9 .risk-item.open { border-color: var(--gb-green); }
      .v9 .risk-item.open .risk-btn { background: rgba(155, 188, 15, 0.08); }
      .v9 .risk-toggle::before { content: 'ACK'; font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; }
      .v9 .risk-item.open .risk-toggle { transform: none; color: var(--gb-green); }
      .v9 .risk-item.open .risk-toggle::before { content: 'OK'; }
      .v9 .risk-why { padding-left: 2.4rem; font-size: 0.76rem; }

      /* ══════════════════════════════════════════════════════════
         V5 — Inventory Slots (master / detail)
         ══════════════════════════════════════════════════════════ */
      .md-wrap { display: grid; grid-template-columns: minmax(150px, 190px) minmax(0, 1fr); gap: 0.9rem; flex: 1 1 auto; min-height: 0; }
      .v5 .slot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.35rem; align-content: start; }
      .v5 .slot {
        aspect-ratio: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.15rem;
        background: rgba(10, 14, 39, 0.7);
        border: 2px solid rgba(0, 240, 255, 0.3);
        color: var(--phosphor);
        font: inherit;
        cursor: pointer;
        border-radius: 0;
        padding: 0.2rem;
        transition: all 0.15s ease;
      }
      .v5 .slot:hover { border-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.1); }
      .v5 .slot .s-icon { font-size: 1.25rem; line-height: 1; }
      .v5 .slot .s-num { font-family: var(--font-terminal); font-size: 0.9rem; line-height: 1; color: rgba(0, 240, 255, 0.7); }
      .v5 .slot .s-label { font-size: 0.6rem; line-height: 1.2; text-align: center; opacity: 0.8; }
      .v5 .slot.sel {
        border-color: var(--neon-magenta);
        background: rgba(255, 46, 136, 0.18);
        box-shadow: 0 0 8px var(--neon-magenta), 0 0 24px rgba(255, 46, 136, 0.35);
      }
      .v5 .slot.sel .s-num { color: var(--crt-amber); }
      .v5 .detail {
        border: 2px solid rgba(255, 46, 136, 0.45);
        background: rgba(255, 46, 136, 0.07);
        padding: 0.75rem 0.9rem;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .v5 .detail .d-title { font-size: 1rem; color: var(--crt-amber); margin: 0 0 0.45rem; line-height: 1.3; }
      .v5 .detail .d-why { font-size: 0.82rem; line-height: 1.65; margin: 0; color: rgba(232, 244, 255, 0.9); }
      .v5 .detail .d-empty { font-family: var(--font-terminal); font-size: 1.15rem; color: rgba(0, 240, 255, 0.55); margin: auto; text-align: center; }

      /* ══════════════════════════════════════════════════════════
         V7 — Stage Select Trail (re-shape)
         ══════════════════════════════════════════════════════════ */
      .v7 .trail { position: relative; display: flex; justify-content: space-between; align-items: flex-start; margin: 0.5rem 0 0.9rem; padding: 0 0.2rem; }
      .v7 .trail::before {
        content: '';
        position: absolute;
        top: 17px; left: 2%; right: 2%;
        height: 2px;
        background: repeating-linear-gradient(to right, rgba(0, 240, 255, 0.45) 0 6px, transparent 6px 12px);
      }
      .v7 .node {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
        background: none;
        border: none;
        font: inherit;
        color: var(--phosphor);
        cursor: pointer;
        padding: 0;
        width: 11%;
        border-radius: 0;
      }
      .v7 .node .n-dot {
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.05rem;
        background: var(--midnight);
        border: 2px solid rgba(0, 240, 255, 0.45);
        transition: all 0.16s ease;
      }
      .v7 .node:hover .n-dot { border-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }

      /* ══════════════════════════════════════════════════════════
         V10 — Card Flip (wildcard)
         ══════════════════════════════════════════════════════════ */
      .v10 .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.55rem; flex: 1 1 auto; align-content: center; }
      .v10 .card {
        position: relative;
        aspect-ratio: 1 / 1;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        perspective: 800px;
        font: inherit;
        color: inherit;
        border-radius: 0;
      }
      .v10 .card-inner {
        position: relative;
        width: 100%; height: 100%;

        transition: transform 0.5s cubic-bezier(0.4, 0.1, 0.2, 1);
      }
      .v10 .card.flip .card-inner { transform: rotateY(180deg); }
      .v10 .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        padding: 0.4rem;
        overflow: hidden;
      }
      .v10 .face-front {

      .v10 .face-front .c-icon { font-size: 1.5rem; line-height: 1; }

      .v10 .face-front .c-label { font-size: 0.63rem; line-height: 1.25; text-align: center; opacity: 0.85; }
      .v10 .face-back {

      .hint {

        { cls: 'v1', kind: 'accordion', name: 'V1 — Codex Rows', wide: false,
          desc: 'Anchor。既存の表を素直に畳んだ形。破線区切り + [+]/[-]、開いた行に左マゼンタバー。' },

      let LANG = 'en';

      const esc = (s) => s;
      const pad = (n) => String(n).padStart(2, '0');

      // ── Builders ───────────────────────────────────────────────
      function accordionHTML(v, d) {
        const rows = d.items
          .map((it, i) => {
            const gauge =
              '<span class="risk-gauge" aria-hidden="true">' +
              Array.from({ length: 5 }, (_, k) => `<i class="${k < it.danger ? 'on' : ''}"></i>`).join('') +
              '</span>';
            return (
              `<div class="risk-item" data-i="${i}">` +
              `<button class="risk-btn" type="button" aria-expanded="false">` +
              `<span class="risk-lamp" aria-hidden="true"></span>` +
              `<span class="risk-num">${pad(i + 1)}</span>` +
              `<span class="risk-icon" aria-hidden="true">${it.icon}</span>` +
              `<span class="risk-label">${esc(it.label)}</span>` +
              gauge +
              `<span class="risk-toggle" aria-hidden="true"></span>` +
              `</button>` +
              `<div class="risk-body"><div class="risk-body-inner">` +
              `<p class="risk-why">${it.why}</p>` +
              `</div></div>` +
              `</div>`
            );
          })
          .join('');
        return (
          `<div class="risk-widget ${v.cls}">` +
          `<p class="risk-intro">${d.intro}</p>` +
          `<div class="risk-widget-inner"><div class="risk-list">${rows}</div></div>` +
          `</div>`
        );
      }

              `<span class="s-num">${pad(i + 1)}</span>` +
              `<span class="s-label">${esc(it.short)}</span>` +
              `</button>`
          )
          .join('');
        return (
          `<div class="risk-widget ${v.cls}" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0">` +
          `<p class="risk-intro">${d.intro}</p>` +
          `<div class="md-wrap">` +
          `<div class="slot-grid">${slots}</div>` +
          `<div class="detail"><p class="d-empty">${d.empty}</p></div>` +
          `</div></div>`

      function trailHTML(v, d) {

        accordion: accordionHTML,
        inventory: inventoryHTML,

      function render() {
        const d = DATA[LANG];
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = VARIANTS.map(
          (v) =>

            `<div class="slide-stage"><div class="slide-frame">` +
            `<h2 class="slide-h2">${d.h2}</h2>` +
            `<p class="hint">${d.hint}</p>` +
            BUILDERS[v.kind](v, d) +
            `<p class="risk-foot">${d.foot}</p>` +
            `</div></div></section>`
        ).join('');
        fitStages();

      // Scale each 768x587 logical slide to its column, and flag overflow.
      function fitStages() {
        document.querySelectorAll('.slide-stage').forEach((stage) => {
          const frame = stage.querySelector('.slide-frame');
          const s = stage.clientWidth / 768;
          frame.style.transform = `scale(${s})`;
          stage.style.height = 587 * s + 'px';
        });
        checkOverflow();
      }

      function checkOverflow() {
        document.querySelectorAll('.slide-frame').forEach((frame) => {
          const over = frame.scrollHeight - frame.clientHeight > 2;
          frame.parentElement.classList.toggle('overflowing', over);
        });
      }

      window.addEventListener('resize', fitStages);

      // ── Interaction: one open at a time, revealed in order ──────
      document.getElementById('gallery').addEventListener('click', (e) => {
        const proto = e.target.closest('.proto');
        if (!proto) return;
        const d = DATA[LANG];

        // Accordion variants
        const btn = e.target.closest('.risk-btn');
        if (btn) {
          const item = btn.closest('.risk-item');
          const list = item.parentElement;
          const wasOpen = item.classList.contains('open');
          list.querySelectorAll('.risk-item.open').forEach((el) => {
            el.classList.remove('open');
            el.querySelector('.risk-btn').setAttribute('aria-expanded', 'false');
          });
          if (!wasOpen) {
            item.classList.add('open');
            btn.setAttribute('aria-expanded', 'true');
          }
          setTimeout(checkOverflow, 320);
          return;
        }

        // V5 inventory
        const slot = e.target.closest('.slot');
        if (slot) {
          const w = proto.querySelector('.risk-widget');
          w.querySelectorAll('.slot').forEach((s) => s.classList.remove('sel'));
          slot.classList.add('sel');
          const it = d.items[+slot.dataset.i];
          w.querySelector('.detail').innerHTML =
            `<h3 class="d-title">${it.icon} ${it.label}</h3><p class="d-why">${it.why}</p>`;
          checkOverflow();
          return;
        }

        // V7 trail
        const node = e.target.closest('.node');
        if (node) {
          const w = proto.querySelector('.risk-widget');
          w.querySelectorAll('.node').forEach((n) => n.classList.remove('sel'));
          node.classList.add('sel', 'done');
          const i = +node.dataset.i;
          const it = d.items[i];
          w.querySelector('.stage-panel').innerHTML =
            `<div class="p-head"><span class="p-num">${pad(i + 1)}</span>` +
            `<span class="p-title">${it.icon} ${it.label}</span></div>` +
            `<p class="p-why">${it.why}</p>`;
          checkOverflow();
          return;
        }

        // V8 split deck
        const pick = e.target.closest('.pick');
        if (pick) {
          const w = proto.querySelector('.risk-widget');
          w.querySelectorAll('.pick').forEach((p) => p.classList.remove('sel'));
          pick.classList.add('sel');
          const it = d.items[+pick.dataset.i];
          w.querySelector('.pane').innerHTML =
            `<div class="x-icon" aria-hidden="true">${it.icon}</div>` +
            `<h3 class="x-title">${it.label}</h3><p class="x-why">${it.why}</p>`;
          checkOverflow();
          return;
        }

        // V10 cards
        const card = e.target.closest('.card');
        if (card) {
          const w = proto.querySelector('.risk-widget');
          const wasFlipped = card.classList.contains('flip');
          w.querySelectorAll('.card.flip').forEach((c) => c.classList.remove('flip'));
          if (!wasFlipped) card.classList.add('flip');
          checkOverflow();
        }
      });

      // ── Controls ───────────────────────────────────────────────
      document.querySelectorAll('.ctl[data-lang]').forEach((b) => {
        b.addEventListener('click', () => {
          LANG = b.dataset.lang;
          document.querySelectorAll('.ctl[data-lang]').forEach((x) => x.classList.toggle('on', x === b));
          render();
        });
      });
      document.getElementById('reset').addEventListener('click', render);

      render();
    </script>
  </body>
</html>
